name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm install --no-save --no-audit --no-fund matterbridge@3.10.13
      - run: npm run build
      - run: npm pack
      - uses: actions/upload-artifact@v4
        with:
          name: matterbridge-frigate-tgz
          path: '*.tgz'
